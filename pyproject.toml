[project]
name = "cascade"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "comtypes>=1.4.16",
    "mss>=10.2.0",
    "orjson>=3.12.0",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "pydantic>=2.13.5",
    "pyside6>=6.11.2",
    "pywin32>=312",
    "watchdog>=6.0.0",
    # Windows OCR (F14 secimi). Not: pip ile kuruldu; uv.lock henuz
    # icermiyor -- bir sonraki `uv sync/add` kilidi gunceller.
    "winrt-runtime>=3.2",
    "winrt-windows.foundation>=3.2",
    "winrt-windows.foundation.collections>=3.2",
    "winrt-windows.globalization>=3.2",
    "winrt-windows.graphics.imaging>=3.2",
    "winrt-windows.media.ocr>=3.2",
    "winrt-windows.storage.streams>=3.2",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.13"
include = ["cascade", "tests"]
typeCheckingMode = "standard"
